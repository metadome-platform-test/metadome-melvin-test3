name: CI/CD on Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [staging, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: "platform-team-452807"
  GAR_NAME: "gcr-registry-${{ github.ref_name }}"
  GAR_LOCATION: "asia-south1"
  REGION: "asia-south1"
  SERVICE: "metadome-platform-api-server-${{ github.ref_name }}"
  DEPLOYMENT_TYPE: "CLOUD_RUN"
  PORT: 3000

jobs:
  CI-Service:
    runs-on: "ubuntu-latest"
    environment: ${{ github.ref_name == 'dev' && github.ref_name || '' }}
    outputs:
      REPOSITORY_NAME: ${{ steps.setup.outputs.REPOSITORY_NAME }}
      DEPLOYMENT_TYPE: ${{ steps.pass_deployement_type.outputs.DEPLOYMENT_TYPE }}

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332" # actions/checkout@v4

      # See https://github.com/google-github-actions/auth for more options,
      # including authenticating via a JSON credentials file.

      - name: Setup NodeJs
        uses: actions/setup-node@v2
        with:
          node-version: "18"

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2" # google-github-actions/auth@v2
        with:
          credentials_json: ${{ (github.ref_name == 'main' || github.ref_name == 'staging') && secrets.GCP_PLATFORM || secrets.GCP_PLATFORM }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # BEGIN - Docker auth and build
      #
      # If you already have a container image, you can omit these steps.
      - name: "Docker Auth"
        run: |-
          gcloud auth configure-docker "${{ env.GAR_LOCATION }}-docker.pkg.dev"

      - name: "Build and Push Container"
        run: |-
          docker build -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_NAME }}/${{ env.SERVICE }}:${{ github.sha }}" ./
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_NAME }}/${{ env.SERVICE }}:${{ github.sha }}"

      - name: Go to CD
        id: pass_deployement_type
        run: echo "DEPLOYMENT_TYPE=${{ env.DEPLOYMENT_TYPE }}" >> $GITHUB_OUTPUT

  CD-Cloud-Run-Service:
    if: ${{ needs.CI-Service.outputs.DEPLOYMENT_TYPE == 'CLOUD_RUN' }}
    needs: CI-Service
    runs-on: ubuntu-latest
    environment: ${{ ( github.ref_name == 'dev') && github.ref_name || '' }}
    steps:
      - name: Configure GCP credentials
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ (github.ref_name == 'dev') && secrets.GCP_PLATFORM || secrets.GCP_PLATFORM }}

      - name: "Deploy to Cloud Run Service"
        uses: "google-github-actions/deploy-cloudrun@33553064113a37d688aa6937bacbdc481580be17" # google-github-actions/deploy-cloudrun@v2
        with:
          service: "${{ env.SERVICE }}"
          region: "${{ env.REGION }}"
          image: "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_NAME }}/${{ env.SERVICE }}:${{ github.sha }}"
          env_vars: |-
            SERVER_HOST=https://metadome-platform-api-server-dev-290267974501.asia-south1.run.app
            SERVER_PORT=3000
            DEPLOYMENT_ENVIRONMENT=${{ github.ref_name }}
            DEPLOYMENT_NAME=Metadome Platform
            LOGGER_LEVEL=3
            GITHUB_OWNER=${{github.ref_name == 'dev' && 'metadome-platform-test' || (github.ref_name == 'main' || github.ref_name == 'staging') && 'Adloid-Technologies'}}
          secrets: |-
            MONGO_URL=Mongo-${{ github.ref_name }}:latest
            JWT_SIGNING_SECRET=Auth-JWT-${{ github.ref_name }}:latest
            GITHUB_TOKEN=GITHUB_TOKEN-${{ github.ref_name }}:latest
          flags: "--allow-unauthenticated --min-instances=0 --max-instances=10 --memory=1Gi --network=default --subnet=default --vpc-egress=private-ranges-only --allow-unauthenticated --service-account=platform-sa@platform-team-452807.iam.gserviceaccount.com"

      - name: "Show output"
        run: |2-

           echo ${{ steps.deploy.outputs.url }}
